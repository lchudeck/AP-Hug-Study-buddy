name: Foundation cleanup validation

on:
  push:
    branches:
      - agent/study-buddy-foundation-cleanup
    paths:
      - .github/workflows/foundation-cleanup.yml
      - index.html
      - app.js
      - styles.css
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/study-buddy-foundation-cleanup

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check foundation requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          css=Path('styles.css').read_text(encoding='utf-8')
          assert '<link rel="stylesheet" href="styles.css">' in index
          assert '<script src="app.js"></script>' in index
          assert '<style>' not in index
          assert '<script>' not in index
          assert 'May 5, 2026' not in index + js
          assert 'Grade my answer with AI' not in js
          assert js.count('function homePage(){') == 1
          assert 'localStorage.setItem("aphgUnitStats"' in js
          assert "if(!s.attempted) return null;" in js
          assert '2026–27 Study Plan' in js
          assert 'Date TBA' in js
          assert len(js) > 200000
          assert len(css) > 10000
          print('Foundation validation passed')
          PY
