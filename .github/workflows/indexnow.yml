name: Notify IndexNow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "seo-indexnow.js"
      - ".github/workflows/indexnow.yml"
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node seo-indexnow.js
