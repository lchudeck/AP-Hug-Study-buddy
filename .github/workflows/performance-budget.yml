name: Performance budget

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  performance-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated startup assets match their readable sources
        run: |
          npm install --prefix /tmp/aphg-assets --no-save --no-package-lock terser@5.51.2
          NODE_PATH=/tmp/aphg-assets/node_modules node scripts/build-startup-assets.cjs --check

      - name: Check initial JavaScript budget
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html)
          local_scripts = [s.split('?', 1)[0] for s in scripts if not s.startswith(('http://', 'https://', '//'))]
          missing = [s for s in local_scripts if not Path(s).is_file()]
          if missing:
              raise SystemExit(f'Missing script files referenced by index.html: {missing}')

          total_bytes = sum(Path(s).stat().st_size for s in local_scripts)
          print(f'Initial scripts: {len(local_scripts)}')
          print(f'Initial JavaScript bytes: {total_bytes:,}')

          # Temporary ceiling while Maps 2.0 adds local map rendering/data logic. Sprint 1 reliability will consolidate startup scripts and tighten this budget again.
          if len(local_scripts) > 48:
              raise SystemExit('Performance regression: index.html loads more than 48 JavaScript files.')
          if total_bytes > 1_000_000:
              raise SystemExit('Performance regression: initial JavaScript exceeds 1,000,000 bytes.')
          PY

      - name: Verify static asset caching
        run: |
          grep -F 'for = "/*.js"' netlify.toml
          grep -F 'for = "/*.css"' netlify.toml
          grep -F 'stale-while-revalidate=86400' netlify.toml
