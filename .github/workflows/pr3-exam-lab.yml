name: PR3 AP Exam Lab validation

on:
  push:
    branches:
      - agent/pr3-ap-style-practice
  pull_request:
    paths:
      - index.html
      - exam-lab.js
      - .github/workflows/pr3-exam-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check exam-lab.js
      - name: Verify practice coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index=Path('index.html').read_text(encoding='utf-8')
          js=Path('exam-lab.js').read_text(encoding='utf-8')
          assert '<script src="exam-lab.js"></script>' in index
          assert "['examLab','🧪 Exam Lab']" in js
          # Seven unit stimulus sets and seven unit FRQs should be present.
          set_block=js.split('const sets=[',1)[1].split('const frqs=[',1)[0]
          frq_block=js.split('const frqs=[',1)[1].split('let mode=',1)[0]
          assert len(re.findall(r"\{unit:\d,title:", set_block)) == 7
          assert len(re.findall(r"\{unit:\d,title:", frq_block)) == 7
          for unit in range(1,8):
              assert f'{{unit:{unit},title:' in set_block
              assert f'{{unit:{unit},title:' in frq_block
          # Each stimulus set has exactly three MCQs; each mini-FRQ has three parts.
          assert set_block.count("qs:[") == 7
          assert frq_block.count("parts:[") == 7
          assert set_block.count("],\n      ['") >= 14
          assert frq_block.count("],['") >= 14
          assert 'All stimuli and questions are original' in js
          print('PR3 Exam Lab validation passed')
          PY
