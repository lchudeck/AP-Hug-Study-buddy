name: PR6 Practice Mastery validation

on:
  push:
    branches:
      - agent/pr6-practice-mastery
  pull_request:
    paths:
      - index.html
      - practice-mastery.js
      - .github/workflows/pr6-practice-mastery.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check practice-mastery.js
      - name: Verify mastery engine
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('practice-mastery.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          assert '<script src="practice-mastery.js"></script>' in index
          for label in ['Practice & Mastery','Unit 1 Test','Cumulative Practice','Review Missed','CED Topic Readiness','Revisit these CED topics']:
              assert label in js, label
          for u in range(1,8):
              assert f'[{u},' in js, u
          topics=['1.1','1.2','1.4','1.6','1.7','2.1','2.3','2.5','2.8','2.10','3.2','3.3','3.4','3.7','4.1','4.2','4.4','4.6','4.8','5.1','5.4','5.6','5.9','5.12','6.1','6.3','6.5','6.10','6.11','7.2','7.3','7.4','7.5','7.8']
          for t in topics: assert f"'{t}'" in js, t
          assert "localStorage" in js
          assert "missed" in js
          assert "readiness" in js
          print('PR6 Practice & Mastery validation passed')
          PY
