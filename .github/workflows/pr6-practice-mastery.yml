name: PR6 Practice Mastery validation

on:
  push:
    branches:
      - agent/pr6-practice-mastery
  pull_request:
    paths:
      - index.html
      - practice-mastery.js
      - practice-bank-expanded.js
      - image-mcq-bank.js
      - stimulus-sets.js
      - stimulus-sets-extra.js
      - real-data-stimulus.js
      - reflection-fix.js
      - .github/workflows/pr6-practice-mastery.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in practice-mastery.js practice-bank-expanded.js image-mcq-bank.js stimulus-sets.js stimulus-sets-extra.js real-data-stimulus.js reflection-fix.js; do node --check "$f"; done
      - name: Verify mastery, visual sets, and real data
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('practice-mastery.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          files=['practice-bank-expanded.js','image-mcq-bank.js','stimulus-sets.js','stimulus-sets-extra.js','real-data-stimulus.js','practice-mastery.js','reflection-fix.js']
          for src in files: assert f'<script src="{src}"></script>' in index, src
          for label in ['What should I do next?','Start 5-Minute Practice','Review My Mistakes','Progress by Topic','Use this source:']:
              assert label in js, label
          for token in ['seenKey','buildDeck','chooseSets','setToQuestions','saved?.id','shuffle(q.choices)','APHG_REAL_DATA_QUESTIONS']:
              assert token in js, token
          assert 'APHG_EXPANDED_BANK' not in js, 'answer-leaking draft bank must not be served'
          sets=Path('stimulus-sets.js').read_text(encoding='utf-8')+Path('stimulus-sets-extra.js').read_text(encoding='utf-8')
          for u in range(1,8): assert f'unit:{u}' in sets, f'visual set missing unit {u}'
          real=Path('real-data-stimulus.js').read_text(encoding='utf-8')
          for source in ['U.S. Census Bureau','World Bank','TIGERweb','2024 ACS']:
              assert source in real, source
          assert 'logReason' in Path('reflection-fix.js').read_text(encoding='utf-8')
          print('PR6 Practice & Mastery validation passed')
          PY
      - name: Static student button audit
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          sources='\n'.join(p.read_text(encoding='utf-8') for p in Path('.').glob('*.js'))+'\n'+Path('index.html').read_text(encoding='utf-8')
          handlers=[]
          for attr in ('onclick','onchange','oninput'):
              handlers += re.findall(rf'{attr}=["\']([^"\']+)["\']', sources)
          calls=set()
          for h in handlers:
              calls.update(re.findall(r'(?<!\.)\b([A-Za-z_$][\w$]*)\s*\(', h))
          ignore={'if','for','while','switch','Math','Number','String','parseInt','confirm','alert','setTimeout','setInterval','getElementById','split','toggle','scrollIntoView','replace','trim','toLowerCase'}
          missing=[]
          for name in sorted(calls-ignore):
              pats=[rf'function\s+{re.escape(name)}\s*\(',rf'window\.{re.escape(name)}\s*=',rf'\b{re.escape(name)}\s*=\s*\(?[^\n=]*=>',rf'\b(?:const|let|var)\s+{re.escape(name)}\s*=']
              if not any(re.search(p,sources) for p in pats): missing.append(name)
          if missing:
              raise SystemExit('Potential dead button handlers: '+', '.join(missing))
          print(f'Button audit passed: {len(handlers)} handlers / {len(calls)} app-level functions checked')
          PY
