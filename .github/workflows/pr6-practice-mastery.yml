name: PR6 Practice Mastery validation

on:
  push:
    branches:
      - agent/pr6-practice-mastery
  pull_request:
    paths:
      - index.html
      - practice-mastery.js
      - practice-bank-expanded.js
      - reflection-fix.js
      - .github/workflows/pr6-practice-mastery.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check practice-mastery.js
          node --check practice-bank-expanded.js
          node --check reflection-fix.js
      - name: Verify mastery engine
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('practice-mastery.js').read_text(encoding='utf-8')
          bank=Path('practice-bank-expanded.js').read_text(encoding='utf-8')
          reflection=Path('reflection-fix.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          for src in ['practice-bank-expanded.js','practice-mastery.js','reflection-fix.js']:
              assert f'<script src="{src}"></script>' in index, src
          for label in ['Practice & Mastery','Cumulative · 30 Q','Review Missed','CED Topic Readiness','Revisit:']:
              assert label in js, label
          for u in range(1,8):
              assert f'Unit ${{u}} · 25 Q' in js or 'map(u=>' in js
          for token in ['seenKey','buildDeck','loadSeen','saveSeen','shuffle(q.choices)','Mastery requires at least 5 attempts']:
              assert token in js, token
          assert 'APHG_EXPANDED_BANK' in bank
          assert 'logReason' in reflection
          assert 'localStorage' in js and 'missed' in js
          print('PR6 Practice & Mastery validation passed')
          PY
