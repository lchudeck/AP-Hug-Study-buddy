name: Student reliability regression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'frq-part-scoring.js'
      - 'student-reliability-patch.js'
      - 'session-rating.js'
      - 'student-proof-v1.js'
      - 'tests/frq-scoring-regression.cjs'
      - 'tests/unit2-frq-accuracy-regression.cjs'
      - 'tests/unit2-frq-integration-regression.cjs'
      - 'pr6-frq-polish.js'
      - 'strict-frq-drill-grading.js'
      - 'ced-content-audit-fixes.js'
      - 'ced-final-audit-patch.js'
      - 'tests/practice-exam-quality-regression.cjs'
      - 'tests/readiness-evidence-regression.cjs'
      - '.github/workflows/student-reliability-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frq-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check reliability patch
        run: node --check student-reliability-patch.js
      - name: Syntax check FRQ scorer
        run: node --check frq-part-scoring.js
      - name: Syntax check readiness tracker
        run: node --check session-rating.js
      - name: Verify reliability patch is loaded in production
        run: grep -Eq '<script src="student-reliability-patch.js(\?[^"]*)?"></script>' index.html
      - name: Run FRQ regression cases
        run: node tests/frq-scoring-regression.cjs
      - name: Run Unit 2 FRQ accuracy cases
        run: node tests/unit2-frq-accuracy-regression.cjs
      - name: Install DOM test dependency outside the repository
        run: npm install --prefix /tmp/aphg-frq-test jsdom@26
      - name: Run Unit 2 FRQ integration checks
        env:
          NODE_PATH: /tmp/aphg-frq-test/node_modules
        run: node tests/unit2-frq-integration-regression.cjs
      - name: Run practice exam quality regression
        run: node tests/practice-exam-quality-regression.cjs
      - name: Run readiness evidence regression
        run: node tests/readiness-evidence-regression.cjs
