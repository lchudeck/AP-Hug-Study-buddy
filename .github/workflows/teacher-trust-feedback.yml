name: Teacher trust and student feedback validation

on:
  pull_request:
    paths: ['about.html','privacy.html','index.html','student-feedback.js','.github/workflows/teacher-trust-feedback.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock jsdom@26 >/dev/null 2>&1
      - name: Validate feedback flow and trust pages
        run: |
          python3 -m http.server 8765 >/tmp/aphg-http.log 2>&1 &
          SERVER=$!; trap 'kill $SERVER' EXIT
          node <<'NODE'
          (async()=>{
            const {JSDOM}=require('jsdom');
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const dom=await JSDOM.fromURL('http://127.0.0.1:8765/index.html',{resources:'usable',runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.alert=()=>{};w.confirm=()=>false;w.scrollTo=()=>{};w.matchMedia=()=>({matches:false,addListener(){},removeListener(){}});w.requestAnimationFrame=cb=>setTimeout(cb,0);w.fetch=async()=>({ok:true,status:200,text:async()=>''});}});
            await new Promise(r=>dom.window.addEventListener('load',r,{once:true})); await sleep(100);
            const d=dom.window.document;
            if(!d.querySelector('form[name="study-buddy-feedback"]'))throw new Error('Hidden feedback form missing');
            const b=d.querySelector('#aphg-feedback-btn'); if(!b)throw new Error('Quick feedback button missing'); b.click(); await sleep(10);
            const modal=d.querySelector('#aphg-feedback-modal'); if(!modal)throw new Error('Feedback modal missing');
            const text=modal.textContent;
            for(const phrase of ['30-second feedback','Was this part helpful?','What, if anything, was confusing?','No name or email is requested.'])if(!text.includes(phrase))throw new Error('Missing feedback copy: '+phrase);
            if(!modal.querySelector('input[name="helpful"][value="Yes"]'))throw new Error('Helpful Yes option missing');
            const about=await (await fetch('http://127.0.0.1:8765/about.html')).text();
            for(const phrase of ['What teachers can expect','How quality is reviewed','Privacy commitments'])if(!about.includes(phrase))throw new Error('About missing '+phrase);
            const privacy=await (await fetch('http://127.0.0.1:8765/privacy.html')).text();
            if(!privacy.includes('Optional feedback and problem reports'))throw new Error('Privacy disclosure missing');
            console.log('Teacher trust and student feedback validation passed.');
            dom.window.close();process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
