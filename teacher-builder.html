<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Test Builder | APHUG Study Buddy</title><meta name="robots" content="noindex"><link rel="stylesheet" href="teacher-builder.css"></head><body><header class="teacher-top no-print"><div class="wrap"><a href="index.html">← Student Study Buddy</a><h1>Teacher Test Builder</h1><p>Unit 1 prototype · vetted questions · original visual stimuli · printable test and answer key</p></div></header><main class="builder-layout"><aside class="builder-panel no-print"><h2>Build an assessment</h2><label for="assessment-title">Title</label><input id="assessment-title" value="Unit 1 Assessment"><label for="question-count">Questions</label><select id="question-count"><option>10</option><option selected>20</option><option>30</option><option>40</option></select><label for="difficulty">Difficulty</label><select id="difficulty"><option value="mixed" selected>AP Exam Mix</option><option value="1">Foundation</option><option value="2">On-level</option><option value="3">Challenge</option></select><label for="visual-rate">Visual stimuli</label><select id="visual-rate"><option value="low">Some (about 20%)</option><option value="standard" selected>AP-style (about 35%)</option><option value="high">Many (about 50%)</option></select><div class="button-stack"><button class="primary" id="create-assessment">Create assessment</button><button id="new-version">Create Version A/B</button><button id="print-assessment">Print test + answer key</button></div><p class="status" id="builder-status" aria-live="polite"></p><small>Preview every question before using it. Replace or remove any item. Student names and results are not collected.</small></aside><div id="assessment-preview"></div></main><div id="nav" hidden></div><div id="app" hidden></div><script src="app.js"></script><script src="unit1-question-bank-v3.js"></script><script src="unit1-visual-assessment-bank.js"></script><script src="teacher-assessment-core.js"></script><script src="teacher-builder.js"></script></body></html>
