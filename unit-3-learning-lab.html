:root{color-scheme:light;font:16px/1.5 system-ui,Arial,sans-serif;color:#1f2937;background:#f5f5fb}*{box-sizing:border-box}body{margin:0}header{background:#3f2d75;color:white;padding:1.2rem max(1rem,calc((100vw - 880px)/2))}header a{color:white}main{max-width:880px;margin:auto;padding:1rem}h1{font-size:1.8rem;margin:.4rem 0}h2{font-size:1.4rem}h3{font-size:1.1rem}.card{background:white;border:1px solid #ded9ec;border-radius:14px;padding:1.2rem;margin:1rem 0;box-shadow:0 2px 8px #21143810}.muted{color:#55516a}.eyebrow{font-weight:700;letter-spacing:.04em}.pill{display:inline-block;background:#eae4ff;border-radius:100px;padding:.3rem .8rem;color:#3b2770;font-weight:650;font-size:.85rem}button{cursor:pointer;border:1px solid #513d87;background:white;color:#32205e;border-radius:10px;padding:.75rem .9rem;font:inherit;font-weight:600;margin:.25rem .25rem .25rem 0}button:hover,button:focus-visible{outline:2px solid #806ac9}button.primary{background:#503589;color:white}.choice{display:block;width:100%;text-align:left;margin:.6rem 0}.choice:disabled{opacity:.8;cursor:default}.choice.correct{border-color:#18744e;background:#e8f6ef}.choice.wrong{border-color:#a12d39;background:#fff0f1}.feedback{border-left:4px solid #6143a1;padding:.7rem 1rem;background:#f4f0ff;margin-top:1rem}.feedback.bad{border-left-color:#ae3145;background:#fff4f4}.diagram{border:1px solid #d8d4e4;border-radius:9px;padding:.8rem;margin:1rem 0;overflow:auto;background:#fbfbfe}.diagram svg{width:100%;max-height:270px}.diagram table{width:100%;border-collapse:collapse;min-width:430px}.diagram td,.diagram th{border:1px solid #a6a0ba;padding:.5rem;text-align:center}.diagram th{background:#ede8fa}.legend{font-size:.88rem;color:#4e4761}.step{display:flex;justify-content:space-between;gap:1rem;align-items:center}progress{width:100%;accent-color:#65489b}textarea{width:100%;min-height:100px;padding:.8rem;font:inherit;border-radius:8px;border:1px solid #8c839b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.small{font-size:.9rem}ul{padding-left:1.4rem}@media(max-width:620px){.grid{display:block}.card{padding:1rem}h1{font-size:1.5rem}}

<header><a href="ap-human-geography-unit-3.html">← Unit 3 guide</a><h1>Unit 3 · Cultural Patterns and Processes</h1><p>Focused learning lab · about 20–30 minutes · no account needed</p></header>
<main><div id="app" aria-live="polite"></div></main>
<script>
(function(){
'use strict';
const V=[
{title:'Cultural landscape evidence',html:'<svg viewBox="0 0 520 210" role="img" aria-label="Schematic of a town square with a temple, market stalls, and a paved plaza"><rect x="0" y="0" width="520" height="210" fill="#e8f3f5"/><path d="M0 170H520" stroke="#888" stroke-width="34"/><rect x="36" y="55" width="130" height="100" fill="#d2b48c"/><path d="M20 55L100 10L182 55Z" fill="#825b4a"/><rect x="86" y="91" width="35" height="64" fill="#765b3c"/><rect x="240" y="100" width="80" height="53" fill="#d99f6c"/><path d="M230 100L280 75L330 100Z" fill="#b74545"/><rect x="367" y="105" width="83" height="50" fill="#d99f6c"/><path d="M357 105L410 78L460 105Z" fill="#b74545"/><text x="35" y="195" font-size="16">Temple</text><text x="245" y="195" font-size="16">Market</text><text x="369" y="195" font-size="16">Market</text></svg>'},
{title:'Language distribution by region',html:'<table aria-label="Share of residents reporting Spanish at home in four invented regions"><tr><th>Region</th><th>Spanish at home</th></tr><tr><td>North</td><td>12%</td></tr><tr><td>West</td><td>66%</td></tr><tr><td>East</td><td>15%</td></tr><tr><td>South</td><td>59%</td></tr></table><p class="legend">Invented data for spatial reasoning, not actual census estimates.</p>'},
{title:'Religion distribution across four areas',html:'<table aria-label="Predominant religion in four fictional areas"><tr><th>Area</th><th>Predominant practice</th></tr><tr><td>A</td><td>Hinduism</td></tr><tr><td>B</td><td>Hinduism</td></tr><tr><td>C</td><td>Christianity</td></tr><tr><td>D</td><td>Islam</td></tr></table><p class="legend">Illustrative areas only. Predominant does not mean exclusive.</p>'},
{title:'Diffusion network over two periods',html:'<svg viewBox="0 0 520 200" role="img" aria-label="Period one shows trend in Metropolis A; period two shows adoption in distant Metropolis B and C but not nearby village D"><rect width="520" height="200" fill="#f7f6fc"/><circle cx="70" cy="85" r="27" fill="#7655aa"/><circle cx="280" cy="35" r="23" fill="#7655aa"/><circle cx="440" cy="85" r="23" fill="#7655aa"/><circle cx="135" cy="155" r="13" fill="#ddd"/><path d="M95 76L256 40M303 41L417 76" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 5"/><text x="22" y="30">A: city, first</text><text x="238" y="95">B: city, later</text><text x="389" y="135">C: city, later</text><text x="94" y="190">D: nearby village, not yet</text></svg>'},
{title:'Migration carries a cultural trait',html:'<svg viewBox="0 0 520 170" role="img" aria-label="People migrate from home region X to distant region Y and establish a familiar food festival there"><rect x="16" y="28" width="158" height="112" rx="12" fill="#d4ede5"/><rect x="344" y="28" width="158" height="112" rx="12" fill="#e9dcfa"/><path d="M180 81H336" stroke="#523c89" stroke-width="6"/><path d="M316 67L340 81L316 96Z" fill="#523c89"/><text x="35" y="65">Region X</text><text x="35" y="95">Food festival</text><text x="356" y="65">Region Y</text><text x="356" y="95">New festival</text><text x="213" y="64">migrants</text></svg>'},
{title:'Toponym layers',html:'<table aria-label="Place names and documented historical evidence in an invented town"><tr><th>Place</th><th>Name/history</th></tr><tr><td>Old Quarter</td><td>French-derived street names from an earlier colonial period</td></tr><tr><td>New Market</td><td>Modern bilingual signs in local language and English</td></tr><tr><td>River Park</td><td>Indigenous-origin river name retained</td></tr></table><p class="legend">Fictional place; historical evidence supplied to avoid guessing from a name alone.</p>'},
{title:'Global cultural products and local adaptation',html:'<table aria-label="Fictional chain restaurant menu in three locations"><tr><th>Location</th><th>Shared brand</th><th>Menu variation</th></tr><tr><td>City A</td><td>Yes</td><td>Beef burger</td></tr><tr><td>City B</td><td>Yes</td><td>Vegetarian patty with local spices</td></tr><tr><td>City C</td><td>Yes</td><td>Rice-based sandwich</td></tr></table><p class="legend">Schematic example, not actual company data.</p>'},
{title:'Sequential cultural change in one neighborhood',html:'<table aria-label="Land use and symbols seen in the same neighborhood over time"><tr><th>Year</th><th>Evidence remaining in landscape</th></tr><tr><td>1850</td><td>Stone church built</td></tr><tr><td>1920</td><td>Church remains; rail depot added</td></tr><tr><td>2020</td><td>Church and depot remain; multilingual storefronts appear</td></tr></table><p class="legend">Illustrative timeline of successive cultural imprints.</p>'}
];
const Q=[
['3.1','foundation','A group shares holiday practices, food traditions, and language. These learned practices taken together are best called…',['Culture','A single cultural trait','A physical region','A dialect'],0,'Culture is a shared system of learned behaviors, beliefs, and practices. A trait is one particular element.','Culture vs. trait: one practice is a trait; a connected set of traits may form a cultural complex.','A community’s annual lantern parade is one specific…',['Cultural trait','Language family'],0],
['3.2','foundation','Which is clearest evidence of a cultural landscape?',['A mountain formed by tectonic forces','A religious building and street signs','A naturally occurring river bend','A winter storm'],1,'Built structures and signs are visible ways people mark and transform places.','Cultural landscape means human imprint on a place; natural landscape emphasizes physical features.','Which feature is more directly cultural?',['A market square','A glacier'],0],
['3.4','foundation','A dance spreads first between influential cities through celebrity performers. Which process best explains the initial spread?',['Contagious diffusion','Hierarchical diffusion','Relocation diffusion','Sequent occupance'],1,'Hierarchical diffusion moves through influential people or places rather than just nearest neighbors.','Relocation requires people moving and carrying a trait; contagious emphasizes contact across nearby people.','A fashion trend moves from capital-city designers to regional designers first.',['Hierarchical','Contagious'],0],
['3.3','scenario','Two neighborhoods speak varieties of the same language that differ mainly in pronunciation and local vocabulary. The varieties are…',['Language families','Dialects','Separate language branches','Lingua francas'],1,'A dialect is a regional or social variety within a language. A family groups related languages at a broader scale, with branches between family and language.','Family → branch → language → dialect is a useful hierarchy, though classification can involve debate.','Two varieties of English differ by local pronunciation. They are…',['Dialects','Language families'],0],
['3.5','scenario','A colonial government promotes its language in schools. Generations later, the language remains widely used. Best explanation?',['Historical political power shaped cultural diffusion','Time-space compression happened before industrialization','No cultural diffusion occurred','Only contagious diffusion can spread languages'],0,'Colonial rule and institutions can impose or spread language over time; this does not mean all people abandon local languages.','Colonialism often involves settlement/control; imperialism broadly refers to extending power or influence.','An empire mandates an official language in government offices. The mechanism includes…',['Institutional power','Natural landform change'],0],
['3.8','scenario','An immigrant community keeps its home language while adding the destination country’s language. This best illustrates…',['Assimilation only','Acculturation','Complete cultural isolation','Cultural extinction'],1,'Acculturation involves adopting some elements of another culture without necessarily losing the original identity.','Assimilation is fuller incorporation into a dominant culture, often with substantial loss of distinct practices; syncretism blends elements into a new form.','A community celebrates both its traditional and newly adopted holidays.',['Acculturation','Complete assimilation'],0],
['3.2','visual','In the scene, which evidence best supports an inference about the town’s cultural landscape?',['The temple and markets reflect human land use','The sky proves the local religion','The town must belong to one ethnic group','The scene proves everyone shares one belief'],0,'The buildings and market arrangement show human use of space; the scene does not prove population identity or beliefs.','Visible landscape evidence supports cautious inference, not claims about everyone living there.','A place has prayer houses and bilingual signs. These directly show…',['Cultural landscape','Only natural environment'],0,0],
['3.3','visual','From the table, what spatial pattern is supported?',['Spanish-at-home shares are higher in West and South','Spanish is spoken by nobody in North','The regions have equal Spanish-speaking shares','West residents all speak only Spanish'],0,'West (66%) and South (59%) have larger shares than North (12%) or East (15%).','Compare values rather than assuming a majority means everybody. A map/table does not by itself explain the causes.','Which share is higher?',['West','East'],0,1],
['3.7','visual','Which supported statement compares the areas in the table?',['A and B have the same predominant religion','All residents of C have the same religion','Islam is an ethnic religion because D lists it','All four areas share one predominant religion'],0,'A and B both list Hinduism as predominant. Tables of majorities do not prove exclusivity.','Ethnic religion is not the same as ethnicity. Hinduism is often described as an ethnic religion; Christianity and Islam are universalizing religions.','Which religion in the table is generally universalizing?',['Islam','Hinduism'],0,2],
['3.4','visual','In the diagram, the trait moves from city A to distant cities B and C before nearby village D. Which process fits best?',['Hierarchical diffusion','Contagious diffusion only','Assimilation','Sequent occupance'],0,'The influential city-to-city route despite a nearby village not adopting is the distinctive evidence.','Contagious diffusion tends to spread via widespread contact; hierarchical diffusion follows influential networks.','A trend moves across major corporate headquarters before small towns.',['Hierarchical','Contagious'],0,3],
['3.4','visual','Which detail makes relocation diffusion the strongest explanation?',['Migrants bring the food festival from X to Y','Adjacent villages adopt the festival without migration','The festival originated in the mountains','All festivals follow a hierarchy'],0,'The arrow labels movement of people who bring a cultural practice to a distant destination.','Relocation describes the carrier moving; expansion describes the trait spreading while the origin remains a source.','Families move and open restaurants serving home cuisine abroad.',['Relocation','Contagious only'],0,4],
['3.2','visual','Which inference from the names and historical notes is best supported?',['Several cultural groups left evidence across time','All three names came from the same language','The town has never experienced migration','Every resident must speak French'],0,'Indigenous-origin, French-derived and bilingual naming evidence points to multiple cultural influences, but not exact resident identities.','Toponyms can preserve cultural history. Sequent occupance involves successive groups leaving imprints on the same landscape.','Old colonial street names remain beside new bilingual signs. This suggests…',['Layered cultural influences','One unchanging culture'],0,5],
['3.6','visual','The restaurant table most directly demonstrates which pair of processes?',['Cultural convergence and local adaptation','Complete cultural divergence without connection','Relocation diffusion only','Natural landscape formation'],0,'A shared brand suggests convergence while different menus show adaptation of cultural traits to local preferences.','Globalization can create shared products while stimulus diffusion or glocalization alters how an idea appears locally.','A global service changes its design for local customs. This is…',['Local adaptation','Proof of identical cultures'],0,6],
['3.2','visual','Which concept is best supported by the neighborhood timeline?',['Sequent occupance','Contagious diffusion','A natural landscape untouched by humans','A language family tree'],0,'The church, depot, and storefronts show successive historical layers remaining in the landscape.','Sequent occupance is about cumulative cultural layers over time, not simply a culture moving from one place to another.','Buildings from successive eras remain on one street. This illustrates…',['Sequent occupance','Relocation alone'],0,7],
['3.7','final','A religion encourages conversion and has followers in many countries. Which explanation best fits its global distribution?',['Its universalizing orientation can support spread beyond its hearth','It must be tied to one ethnic group only','Its global spread proves no migration occurred','Every follower converted in the same way'],0,'Universalizing religions seek converts and may diffuse through migration, missionaries, trade, and power; pathways vary.','Do not confuse universalizing with a claim that everyone converts or that only one diffusion mechanism applies.','Which religion is generally universalizing?',['Christianity','Hinduism'],0],
['3.8','final','An existing belief system blends features of two religious traditions into a distinct practice. This best illustrates…',['Syncretism','Complete assimilation','Natural increase','Language divergence'],0,'Syncretism combines elements into a new practice or belief system rather than merely adopting an additional practice.','Acculturation can involve adopting traits while preserving identity; syncretism specifically involves blending.','A new holiday combines rituals from two traditions.',['Syncretism','Natural landscape'],0]
];
const FRQS=[
{title:'Visual FRQ 1 · Landscape over time',visual:7,parts:[
['A','Identify one visible piece of evidence from 2020 that indicates cultural change.','Multilingual storefront signs, alongside older structures, indicate new language practices.'],
['B','Describe how the timeline illustrates sequent occupance.','Successive cultural groups or periods left a church, rail depot, and newer multilingual stores in the same landscape.'],
['C','Explain how migration could contribute to the 2020 pattern.','Migrants may introduce additional languages and businesses, changing signs and commerce while older landscape features remain.']]},
{title:'Visual FRQ 2 · Globalization and culture',visual:6,parts:[
['A','Describe one similarity in the table across all locations.','All three locations feature the same restaurant brand.'],
['B','Explain one way the table supports cultural convergence.','The common brand across locations shows a shared cultural consumer practice spread through global networks.'],
['C','Explain how adaptation changes the effect of diffusion.','Menu variations incorporate local food preferences, so the diffused brand does not produce identical cultural practices everywhere.']]}
];
let i=0,mode='question',wrong=false,attempts={},recovery='',frqIndex=0,frqShown=false;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function diagram(v){return '<div class="diagram"><strong>'+esc(V[v].title)+'</strong>'+V[v].html+'</div>';}
function show(){
if(mode==='done'){return summary();}
if(mode==='frq'){return frq();}
const q=Q[i],stage=q[1]==='foundation'?'Foundation check':q[1]==='scenario'?'Scenario reasoning':q[1]==='visual'?'Visual evidence':'Final mastery check';
const options=q[3],pct=Math.round(i/Q.length*100);
app.innerHTML='<div class="card"><div class="step"><span class="pill">'+esc(stage)+' · CED '+esc(q[0])+'</span><span class="muted">Question '+(i+1)+' of '+Q.length+'</span></div><progress max="100" value="'+pct+'"></progress><p class="muted small">Look for evidence and identify the process, not just a familiar vocabulary word.</p>'+(q[10]!==undefined?diagram(q[10]):'')+'<h2>'+esc(q[2])+'</h2><div id="choices">'+options.map((o,n)=>'<button class="choice" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+esc(o)+'</button>').join('')+'</div><div id="result"></div></div>';
document.querySelectorAll('#choices button').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.n))));
}
function answer(n){
const q=Q[i],correct=n===q[4],buttons=[...document.querySelectorAll('#choices button')];
buttons.forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('correct');if(k===n&&!correct)b.classList.add('wrong');});
const key=q[0];if(!attempts[key])attempts[key]={first:0,total:0,misses:0};attempts[key].total++;if(correct)attempts[key].first++;else attempts[key].misses++;
wrong=!correct;
const result=document.getElementById('result');
result.innerHTML='<div class="feedback '+(correct?'':'bad')+'"><strong>'+(correct?'Correct — explain why.':'Not yet — learn the distinction.')+'</strong><p>'+esc(q[5])+'</p><p><strong>Do not confuse:</strong> '+esc(q[6])+'</p></div>'+(correct?'<button id="next" class="primary">Continue →</button>':'<p><strong>Try a different example before continuing.</strong></p><p>'+esc(q[7])+'</p>'+q[8].map((a,k)=>'<button class="retry" data-r="'+k+'">'+esc(a)+'</button>').join('')+'<div id="retry-feedback" role="status"></div>');
if(correct)document.getElementById('next').addEventListener('click',next);
else document.querySelectorAll('.retry').forEach(b=>b.addEventListener('click',()=>retry(Number(b.dataset.r))));
}
function retry(n){
const q=Q[i];const yes=n===q[9],box=document.getElementById('retry-feedback');
box.innerHTML=yes?'<p class="feedback">That is the correct application. You can continue, but this topic stays on your review list because the first answer was missed.</p><button class="primary" id="next">Continue →</button>':'<p class="feedback bad">Check the explanation and compare the two choices. Choose again using the clue in the new example.</p>';
if(yes){document.querySelectorAll('.retry').forEach(b=>b.disabled=true);document.getElementById('next').addEventListener('click',next);}
}
function next(){i++;if(i===14){mode='frq';frqIndex=0;frqShown=false;}else if(i>=Q.length){mode='done';}show();}
function frq(){
const f=FRQS[frqIndex];
app.innerHTML='<div class="card"><span class="pill">Short FRQ · Visual interpretation</span><h2>'+esc(f.title)+'</h2>'+diagram(f.visual)+'<p>Write a brief content-focused response for A–C. Use specific evidence. Grammar is not scored here. This is a self-check, not automated AP Reader scoring.</p>'+f.parts.map(p=>'<label><strong>'+p[0]+'. '+esc(p[1])+'</strong><textarea aria-label="Part '+p[0]+'" placeholder="Write your response here…"></textarea></label>').join('')+'<div id="frq-check"></div><button id="frq-reveal" class="primary">Compare with sample reasoning</button></div>';
document.getElementById('frq-reveal').addEventListener('click',()=>{
document.getElementById('frq-check').innerHTML='<div class="feedback"><strong>Content-focused self-check:</strong><ul>'+f.parts.map(p=>'<li><b>'+p[0]+'</b>: '+esc(p[2])+'</li>').join('')+'</ul><p>For each part, check that your answer contains the concept and the requested evidence or cause-and-effect connection. These are examples, not the only valid answers.</p><label><input type="checkbox" id="frq-self"> I compared all three parts with the criteria.</label></div><button id="frq-next">Continue to final mastery check →</button>';
document.getElementById('frq-next').addEventListener('click',()=>{if(!document.getElementById('frq-self').checked){alert('Compare all three parts before continuing.');return;}if(frqIndex===1){mode='done';show();}else{i=14;mode='question';show();}});
});
}
function summary(){
const results=Object.keys(attempts).sort().map(key=>({topic:key,correct:attempts[key].first,total:attempts[key].total,misses:attempts[key].misses}));
const weak=results.filter(x=>x.misses>0),score=results.reduce((a,x)=>a+x.correct,0),total=results.reduce((a,x)=>a+x.total,0);
app.innerHTML='<div class="card"><span class="pill">Unit 3 learning snapshot</span><h2>Review complete</h2><p>First-try accuracy: <b>'+score+'/'+total+'</b>. This is diagnostic practice, not an AP exam score.</p><h3>Strong</h3><p>'+(results.filter(x=>!x.misses).map(x=>x.topic).join(', ')||'Keep practicing; no topic was perfect on its first attempt.')+'</p><h3>Needs review</h3><p>'+(weak.map(x=>x.topic).join(', ')||'No missed concepts in this set.')+'</p><h3>Priority concepts to revisit</h3><p>'+(weak.length?weak.slice(0,3).map(x=>'Topic '+x.topic).join(' · '):'Apply your knowledge to unfamiliar images, maps, and written FRQs.')+'</p><p class="muted small">A retry helps you learn, but it does not erase a first-try misconception. This exercise samples Unit 3; a good score does not guarantee CED mastery.</p><button class="primary" id="restart">Practice again</button><button id="extra">Optional second visual FRQ</button><p><a href="ap-human-geography-unit-3.html">Return to Unit 3 guide</a></p></div>';
document.getElementById('restart').addEventListener('click',()=>{i=0;mode='question';attempts={};show()});
document.getElementById('extra').addEventListener('click',()=>{frqIndex=1;mode='frq';frq();const btn=document.getElementById('frq-reveal');btn.textContent='Compare second FRQ with sample reasoning';});
}
show();
})();
</script></body></html>
