(function(){

const V=[
{title:'Cultural landscape evidence',html:'<svg viewBox="0 0 520 210" role="img" aria-label="Schematic of a town square with a temple, market stalls, and a paved plaza"><rect x="0" y="0" width="520" height="210" fill="#e8f3f5"/><path d="M0 170H520" stroke="#888" stroke-width="34"/><rect x="36" y="55" width="130" height="100" fill="#d2b48c"/><path d="M20 55L100 10L182 55Z" fill="#825b4a"/><rect x="86" y="91" width="35" height="64" fill="#765b3c"/><rect x="240" y="100" width="80" height="53" fill="#d99f6c"/><path d="M230 100L280 75L330 100Z" fill="#b74545"/><rect x="367" y="105" width="83" height="50" fill="#d99f6c"/><path d="M357 105L410 78L460 105Z" fill="#b74545"/><text x="35" y="195" font-size="16">Temple</text><text x="245" y="195" font-size="16">Market</text><text x="369" y="195" font-size="16">Market</text></svg>'},
{title:'Language distribution by region',html:'<table aria-label="Share of residents reporting Spanish at home in four invented regions"><tr><th>Region</th><th>Spanish at home</th></tr><tr><td>North</td><td>12%</td></tr><tr><td>West</td><td>66%</td></tr><tr><td>East</td><td>15%</td></tr><tr><td>South</td><td>59%</td></tr></table><p class="legend">Invented data for spatial reasoning, not actual census estimates.</p>'},
{title:'Religious practice across four areas',html:'<table aria-label="Fictional share practicing each religion by area and distance from two hearths"><tr><th>Area</th><th>From hearth A</th><th>From hearth B</th><th>Religion A</th><th>Religion B</th></tr><tr><td>1</td><td>20 km</td><td>900 km</td><td>65%</td><td>12%</td></tr><tr><td>2</td><td>850 km</td><td>20 km</td><td>21%</td><td>70%</td></tr><tr><td>3</td><td>1,600 km</td><td>750 km</td><td>29%</td><td>4%</td></tr><tr><td>4</td><td>2,400 km</td><td>1,700 km</td><td>31%</td><td>2%</td></tr></table><p class="legend">Invented data. Each percentage is the share of residents who practice that religion. Other responses are omitted.</p>'},
{title:'Diffusion network over two periods',html:'<svg viewBox="0 0 520 200" role="img" aria-label="Period one shows trend in Metropolis A; period two shows adoption in distant Metropolis B and C but not nearby village D"><rect width="520" height="200" fill="#f7f6fc"/><circle cx="70" cy="85" r="27" fill="#7655aa"/><circle cx="280" cy="35" r="23" fill="#7655aa"/><circle cx="440" cy="85" r="23" fill="#7655aa"/><circle cx="135" cy="155" r="13" fill="#ddd"/><path d="M95 76L256 40M303 41L417 76" stroke="#7c3aed" stroke-width="4" stroke-dasharray="7 5"/><text x="22" y="30">A: city, first</text><text x="238" y="95">B: city, later</text><text x="355" y="135">C: city, later</text><text x="63" y="190">D: nearby village, no adoption</text></svg>'},
{title:'Migration carries a cultural trait',html:'<svg viewBox="0 0 520 170" role="img" aria-label="People migrate from home region X to distant region Y and establish a familiar food festival there"><rect x="16" y="28" width="158" height="112" rx="12" fill="#d4ede5"/><rect x="344" y="28" width="158" height="112" rx="12" fill="#e9dcfa"/><path d="M180 81H336" stroke="#523c89" stroke-width="6"/><path d="M316 67L340 81L316 96Z" fill="#523c89"/><text x="35" y="65">Region X</text><text x="35" y="95">Food festival</text><text x="356" y="65">Region Y</text><text x="356" y="95">New festival</text><text x="213" y="64">migrants</text></svg>'},

{title:'Global cultural products and local adaptation',html:'<table aria-label="Fictional chain restaurant menu in three locations"><tr><th>Location</th><th>Shared brand</th><th>Menu variation</th></tr><tr><td>City A</td><td>Yes</td><td>Beef burger</td></tr><tr><td>City B</td><td>Yes</td><td>Vegetarian patty with local spices</td></tr><tr><td>City C</td><td>Yes</td><td>Rice-based sandwich</td></tr></table><p class="legend">Schematic example, not actual company data.</p>'},
{title:'Sequential cultural change in one neighborhood',html:'<table aria-label="Land use and symbols seen in the same neighborhood over time"><tr><th>Year</th><th>Evidence remaining in landscape</th></tr><tr><td>1850</td><td>Settlers build a stone church</td></tr><tr><td>1920</td><td>Church remains; a railroad company adds a depot</td></tr><tr><td>2020</td><td>Church and depot remain; new shopkeepers add multilingual signs</td></tr></table><p class="legend">Illustrative timeline of successive cultural imprints.</p>'}
];
const Q=[
['3.1','foundation','A group shares holiday practices, food traditions, and language. These learned practices taken together are best called…',['A single cultural trait', 'A physical region', 'A dialect', 'Culture'],3,'Culture is a shared system of learned behaviors, beliefs, and practices. A trait is one particular element.','Culture vs. trait: one practice is a trait; a connected set of traits may form a cultural complex.','A community’s annual lantern parade is one specific…',['Cultural trait','Language family'],0],
['3.2','foundation','Which is clearest evidence of a cultural landscape?',['A mountain formed by tectonic forces','A religious building and street signs','A naturally occurring river bend','A winter storm'],1,'Built structures and signs are visible ways people mark and transform places.','A cultural landscape combines physical features and human imprints. Signs, buildings, and land uses help identify the cultural imprint.','Which feature is more directly cultural?',['A glacier','A market square'],1],
['3.4','foundation','A dance spreads first between influential cities through celebrity performers. Which process best explains the initial spread?',['Contagious diffusion','Hierarchical diffusion','Relocation diffusion','Sequent occupance'],1,'Hierarchical diffusion moves through influential people or places rather than just nearest neighbors.','Relocation requires people moving and carrying a trait; contagious emphasizes direct contact across a population.','A fashion trend moves from capital-city designers to regional designers first.',['Hierarchical','Contagious'],0],
['3.3','scenario','A city adds signs in several neighborhood languages to its transit system. Which outcome best illustrates a centripetal effect?',['The signs display the same street names in each language','Residents from different language groups feel represented and support the shared transit system','Each neighborhood develops a separate transit system for its own language group','The city’s transit maps become more similar to those in other countries'],1,'A centripetal force helps bring people together. The signs can build a sense of inclusion and support for a shared institution.','A centrifugal force can divide a population. Language differences can unite or divide depending on how institutions respond.','Two rival language groups join a citywide festival committee and develop a shared civic identity. What is the effect?',['Centrifugal','Hierarchical','Centripetal'],2],
['3.5','scenario','A colonial government promotes its language in schools. Generations later, the language remains widely used. Best explanation?',['Time-space compression happened before industrialization', 'No cultural diffusion occurred', 'Only contagious diffusion can spread languages', 'Historical political power shaped cultural diffusion'],3,'Colonial rule and institutions can impose or spread language over time; this does not mean all people abandon local languages.','Colonialism often involves settlement/control; imperialism broadly refers to extending power or influence.','An empire mandates an official language in government offices. The mechanism includes…',['Institutional power','Natural landform change'],0],
['3.8','scenario','An immigrant community keeps its home language while adding the destination country’s language. This best illustrates…',['Acculturation','Assimilation','Multiculturalism at the national scale','Syncretism'],0,'Acculturation involves adopting some elements of another culture without necessarily losing the original identity.','Assimilation is fuller incorporation into a dominant culture, often with substantial loss of distinct practices; syncretism blends elements into a new form.','A community celebrates both its traditional and newly adopted holidays.',['Complete assimilation','Acculturation'],1],
['3.1','visual','Which claim about the town’s cultural practices is best supported by the arrangement shown?',['Commerce occurs near a space used for religious practice','Religious buildings are separated from commercial activity by a large distance','Market stalls occupy the center of the religious building','Most commercial activity takes place outside the town'],0,'The temple and market stalls occupy the same square, so religious and commercial land uses are close together.','A cultural trait can be a practice or a material feature. Visible artifacts can support inferences about practices, but a single scene cannot establish what everyone believes.','A central plaza contains permanent stages and seating. Which inference is supported?',['Every resident attends performances','The space is designed to host gatherings','Performances are the town’s only shared practice'],1,0],
['3.3','visual','A planner wants to study how a relatively high share of home Spanish use might shape a region’s sense of place. Which fieldwork plan uses the table most effectively?',['Interview residents only in North to learn why West has more Spanish use','Survey only West and assume its cultural landscape matches every region’s','Compare Spanish signage and residents’ experiences in West and East','Use the percentages alone to conclude that Spanish caused each region’s identity'],2,'West and East have markedly different shares (66% and 15%). Comparing signs and interviewing residents can show how a language becomes visible and shapes attachment to place.','A distribution shows where something is more common. It cannot establish why a pattern formed or how residents experience it.','A town has a large share of people who speak Polish at home. What would directly help you study whether this shapes a sense of place?',['A map of average rainfall','Interviews about the meaning of Polish storefront signs and gathering places','The national population total'],1,1],
['3.7','visual','Religion A seeks converts and Religion B is closely associated with an ethnic group. Which evidence best supports a difference in how far the religions have spread?',['Both religions have their highest shares in areas close to their own hearths','Religion B has a higher share at its nearest site than A has at its nearest site','Area 2 is closer to hearth B than to hearth A','A reaches 29% and 31% at distant sites, while B has 4% and 2% at those sites'],3,'At areas 3 and 4, A retains substantial shares despite being farther from its hearth than B is from its own. The distribution supports broader reach for A in this sample.','Universalizing religions actively seek converts. Ethnic religions are typically tied to a particular people and place, and can still spread with migrants. A table shows patterns, but cannot prove how individuals adopted a religion.','Migrants continue a religion closely tied to their home region after moving abroad. What can the example show?',['An ethnic religion can spread through relocation','Religions that cross borders must seek converts','Everyone at the destination practices the religion'],0,2],
['3.4','visual','Which diffusion process best fits the order of adoption shown in the diagram?',['Contagious diffusion','Relocation diffusion','Hierarchical diffusion','Stimulus diffusion'],2,'The distant cities adopt before the nearby village. Spread between major centers before nearby smaller places is evidence for hierarchical diffusion.','Contagious diffusion spreads by direct contact without depending on an influential network. Hierarchical diffusion follows a ranking of people or places.','A trend passes from student to student through everyday contact across a school, regardless of popularity. Which process fits best?',['Hierarchical diffusion','Contagious diffusion','Stimulus diffusion'],1,3],
['3.4','visual','Which diffusion process best explains why the festival now takes place in region Y?',['Contagious diffusion','Hierarchical diffusion','Stimulus diffusion','Relocation diffusion'],3,'The migrants carry the practice from region X to region Y. The movement of people is the key evidence.','Relocation describes the carrier moving. Stimulus diffusion involves adopting an idea but adapting its form.','A bakery owner stays home while bakers abroad adopt her bread-making technique and change the grain to suit local crops. Which process fits best?',['Relocation diffusion','Hierarchical diffusion','Stimulus diffusion'],2,4],
['3.5','visual','Which observation best supports the claim that past political control still affects the town’s cultural landscape?',['The river name has an Indigenous origin','French-derived street names from colonial rule remain in the Old Quarter','New Market signs use two languages','New Market signs include English'],1,'The historical note links the existing street names to an earlier colonial government. Present-day bilingual signs show cultural interaction but do not establish past political control.','A toponym is a place name. A name can preserve an imprint of colonialism, trade, or Indigenous history. Use historical evidence to distinguish among those explanations.','A port has old multilingual price lists because merchants needed a shared language to negotiate. Which mechanism best explains the pattern?',['Trade encouraged a lingua franca','Colonial rule imposed one official language','Religious conversion created a new belief system'],0,5],
['3.6','visual','What conclusion about contemporary globalization is best supported by the table?',['A shared consumer brand can spread while local food practices still shape its products','The chain’s spread caused consumers to replace local foods with identical meals','Local differences prevented the chain’s shared brand from spreading','Each menu’s differences prove the restaurants originated independently'],0,'The same brand appears in all three cities, showing one form of cultural convergence. The different menus show how local preferences can shape what spreads.','Convergence makes some practices more similar. Local adaptation can preserve differences even when places become more connected.','A global music platform spreads the same dance trend, but performers in each region adapt it to local music. What does this show?',['Cultural isolation','Global connection and local adaptation together','Identical cultural practices everywhere'],1,6],
['3.2','visual','Which concept is best supported by the neighborhood timeline?',['Contagious diffusion', 'A natural landscape untouched by humans', 'A language family tree', 'Sequent occupance'],3,'The church, depot, and storefronts show successive historical layers remaining in the landscape.','Sequent occupance is about cumulative cultural layers over time, not simply a culture moving from one place to another.','Buildings from successive eras remain on one street. This illustrates…',['Relocation alone','Sequent occupance'],1,7],
['3.7','final','Records show Spanish and Portuguese developed from Latin. Later, Portuguese speakers settled overseas, where different varieties of Portuguese developed. Which interpretation best fits both pieces of evidence?',['Spanish and Portuguese are dialects of present-day Portuguese','Portuguese varieties overseas must belong to a different language family','Spanish and Portuguese are related Romance languages, and migration spread Portuguese beyond its European hearth','Their shared ancestry proves Spanish spread to every Portuguese-speaking region'],2,'Spanish and Portuguese are distinct languages in the Romance branch of Indo-European. Migration can carry a language overseas, where regional varieties may develop.','A family groups languages with shared ancestry. A branch is a subgroup within a family. A dialect is a variety within a language.','Speakers from one region bring their variety of Arabic to another country. Which interpretation is supported?',['The variety spread by relocation and can still be a dialect of Arabic','Crossing a border created a new language family','The destination must have become Arabic’s hearth'],0],
['3.6','final','A local dance once spread mainly through in-person events. After cheap mobile internet becomes available, teenagers abroad begin learning it within days. What changed?',['Travel between the places got physically shorter','Faster communication reduced the effect of distance on cultural exchange','The dance could spread only if performers moved abroad','Each place developed the dance independently'],1,'Mobile internet makes distant interactions faster. This is time-space compression, which can accelerate cultural diffusion.','Time-space compression reduces the time or cost of connecting places. It does not change their physical distance.','Live video lets artists teach a technique overseas without traveling. What changed?',['The cities’ geographic distance','The need for all students to migrate','The speed and ease of exchange across distance'],2],
['3.8','final','An existing belief system blends features of two religious traditions into a distinct practice. This best illustrates…',['Assimilation', 'Acculturation without blending', 'Syncretism', 'Cultural isolation'],2,'Syncretism combines elements into a new practice or belief system rather than merely adopting an additional practice.','Acculturation can involve adopting traits while preserving identity; syncretism specifically involves blending.','A new holiday combines rituals from two traditions.',['Syncretism','Natural landscape'],0]
];
const FRQS=[
{title:'Visual FRQ 1 · Landscape over time',visual:7,parts:[
['A','Identify one visible piece of evidence from 2020 that indicates cultural change.','Multilingual storefront signs, alongside older structures, indicate new language practices.'],
['B','Describe how the timeline illustrates sequent occupance.','Settlers built the church, and a railroad company later added the depot. Both remain alongside signs added by newer shopkeepers.'],
['C','Explain how migration could contribute to the 2020 pattern.','Migrants may introduce additional languages and businesses, changing signs and commerce while older landscape features remain.']]},
{title:'Visual FRQ 2 · Globalization and culture',visual:6,parts:[
['A','Describe one similarity in the table across all locations.','All three locations feature the same restaurant brand.'],
['B','Explain one way the table supports cultural convergence.','The common brand across locations shows a shared cultural consumer practice spread through global networks.'],
['C','Explain how adaptation changes the effect of diffusion.','Menu variations incorporate local food preferences, so the diffused brand does not produce identical cultural practices everywhere.']]}
];
const concepts=['Culture and traits','Cultural landscapes','Identity and sense of place','Types of diffusion','Historical diffusion','Contemporary diffusion','Religion and language','Effects of diffusion'];
const skills=['Distinguish a shared system of practices from one trait','Identify visible human imprints','Trace a trait through an influential network','Explain how language can unite or divide','Connect colonial institutions to current language use','Distinguish acculturation from assimilation','Use artifacts to infer land use','Connect a language distribution to sense of place','Compare the reach of ethnic and universalizing religions','Use adoption order to identify hierarchical diffusion','Recognize when migrants carry a practice','Use place names to trace colonial influence','Explain local adaptation of a global product','Recognize landscape layers across time','Connect language ancestry and migration','Explain how technology reduces barriers to exchange','Distinguish syncretism from acculturation'];
const frqCriteria=[
['Name a feature first shown in 2020. Use the timeline as evidence.','Name at least two features added in different periods and describe how earlier layers remain.','Link a plausible action by migrants to an observed change in signs or storefronts.'],
['Identify the shared brand across all three locations.','Connect the shared brand to a similar consumer practice across places.','Use a specific menu difference to explain why the spread of a brand can preserve local variation.']
];
const scenarioEnd=Q.findIndex(q=>q[1]==='final');
let i=0,mode='question',attempts={},frqIndex=0,frqReview=[];
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function diagram(v){return '<div class="diagram"><strong>'+esc(V[v].title)+'</strong>'+V[v].html+'</div>';}
function show(){
if(mode==='done'){summary();focusHeading();return;}
if(mode==='frq'){frq();focusHeading();return;}
const q=Q[i],stage=q[1]==='foundation'?'Foundation check':q[1]==='scenario'?'Scenario reasoning':q[1]==='visual'?'Visual evidence':'Final mastery check';
const options=q[3],pct=Math.round(i/Q.length*100);
app.innerHTML='<div class="card"><div class="step"><span class="pill">'+esc(stage)+' · CED '+esc(q[0])+'</span><span class="muted">Question '+(i+1)+' of '+Q.length+'</span></div><progress max="100" value="'+pct+'"></progress><p class="muted small">Use a clue from the scenario or visual to choose the best answer.</p>'+(q[10]!==undefined?diagram(q[10]):'')+'<h2>'+esc(q[2])+'</h2><div id="choices">'+options.map((o,n)=>'<button class="choice" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+esc(o)+'</button>').join('')+'</div><div id="result"></div></div>';
document.querySelectorAll('#choices button').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.n))));
if(i>0)focusHeading();
}
function focusHeading(){
const heading=app.querySelector("h2");
heading.tabIndex=-1;
heading.focus({preventScroll:true});
app.scrollIntoView({block:"start"});
}
function answer(n){
const q=Q[i],correct=n===q[4],buttons=[...document.querySelectorAll('#choices button')];
buttons.forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('correct');if(k===n&&!correct)b.classList.add('wrong');});
const key=q[0];if(!attempts[key])attempts[key]={first:0,total:0,misses:[]};attempts[key].total++;if(correct)attempts[key].first++;else attempts[key].misses.push(skills[i]);
const result=document.getElementById('result');
result.innerHTML='<div class="feedback '+(correct?'':'bad')+'"><strong>'+(correct?'Correct. Check your reasoning.':'Take another look.')+'</strong><p>'+esc(q[5])+'</p><p><strong>Key distinction</strong> '+esc(q[6])+'</p></div>'+(correct?'<button id="next" class="primary">Continue →</button>':'<p><strong>Try a different example before continuing.</strong></p><p>'+esc(q[7])+'</p>'+q[8].map((a,k)=>'<button class="retry" data-r="'+k+'">'+esc(a)+'</button>').join('')+'<div id="retry-feedback" role="status"></div>');
const feedback=result.querySelector('.feedback');
feedback.tabIndex=-1;
feedback.focus();
if(correct)document.getElementById('next').addEventListener('click',next);
else document.querySelectorAll('.retry').forEach(b=>b.addEventListener('click',()=>retry(Number(b.dataset.r))));
}
function retry(n){
const q=Q[i];const yes=n===q[9],box=document.getElementById('retry-feedback');
box.innerHTML=yes?'<p class="feedback">That is the correct application. You can continue, but this topic stays on your review list because the first answer was missed.</p><button class="primary" id="next">Continue →</button>':'<p class="feedback bad">Read the distinction above, then use the clue in the new example to try again.</p>';
if(yes){document.querySelectorAll('.retry').forEach(b=>b.disabled=true);document.getElementById('next').addEventListener('click',next);}
}
function next(){i++;if(i===scenarioEnd){mode='frq';frqIndex=0;}else if(i>=Q.length){mode='done';}show();}
function frq(){
const f=FRQS[frqIndex];
app.innerHTML='<div class="card"><span class="pill">Short FRQ · Visual interpretation</span><h2>'+esc(f.title)+'</h2>'+diagram(f.visual)+'<p>Write a brief content-focused response for A–C. Use specific evidence. Grammar is not scored here. This is a self-check, not automated AP Reader scoring.</p>'+f.parts.map(p=>'<label><strong>'+p[0]+'. '+esc(p[1])+'</strong><textarea aria-label="Part '+p[0]+'" placeholder="Write your response here…"></textarea></label>').join('')+'<div id="frq-check" aria-live="polite"></div><button id="frq-reveal" class="primary">Compare with sample reasoning</button></div>';
document.getElementById('frq-reveal').addEventListener('click',()=>{
const fields=[...app.querySelectorAll('textarea')];
const empty=fields.find(field=>!field.value.trim());
const check=document.getElementById('frq-check');
if(empty){check.textContent='Write a response for each part before comparing. Start with '+empty.getAttribute('aria-label')+'.';empty.focus();return;}
const feedback=f.parts.map((part,index)=>'<fieldset><legend>Part '+part[0]+'</legend><p><strong>Look for</strong> '+esc(frqCriteria[frqIndex][index])+'</p><p><strong>Example</strong> '+esc(part[2])+'</p><label><input type="radio" name="part-'+index+'" value="met"> My response meets the criterion</label><br><label><input type="radio" name="part-'+index+'" value="review"> I need to review this part</label></fieldset>').join('');
check.innerHTML='<div class="feedback"><strong>Check your reasoning one part at a time.</strong>'+feedback+'</div><p id="frq-status" role="status"></p><button id="frq-next">'+(frqIndex===1?'Return to review summary':'Continue to final mastery check')+' →</button>';
document.getElementById('frq-reveal').disabled=true;
check.querySelector('input').focus();
document.getElementById('frq-next').addEventListener('click',()=>{
const ratings=[...check.querySelectorAll('input:checked')];
if(ratings.length!==f.parts.length){document.getElementById('frq-status').textContent='Choose a self-rating for each part before continuing.';return;}
frqReview[frqIndex]=ratings.flatMap((rating,index)=>rating.value==='review'?[frqCriteria[frqIndex][index]]:[]);
mode=frqIndex===1?'done':'question';show();
});
});
}
function summary(){
const results=Object.keys(attempts).sort().map(key=>({topic:key,name:concepts[Number(key.split('.')[1])-1],...attempts[key]}));
const weak=results.filter(x=>x.misses.length).sort((a,b)=>b.misses.length-a.misses.length||a.first/a.total-b.first/b.total);
const score=results.reduce((sum,result)=>sum+result.first,0),total=results.reduce((sum,result)=>sum+result.total,0);
const strong=results.filter(result=>!result.misses.length).map(result=>result.topic+' '+result.name);
const writing=frqReview.flat();
const priority=[...(weak[0]?.misses||[]),...writing].slice(0,3);
const list=items=>'<ul>'+items.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul>';
app.innerHTML='<div class="card"><span class="pill">Unit 3 learning snapshot</span><h2>Review complete</h2><p>First-try accuracy: <b>'+score+'/'+total+'</b>. This is practice feedback.</p><h3>Strong on this set</h3>'+(strong.length?list(strong):'<p>Every topic had a first-try miss.</p>')+'<h3>Needs review</h3>'+(weak.length?list(weak.map(result=>result.topic+' '+result.name+' · '+result.misses.join('; '))):'<p>No first-try multiple-choice misses.</p>')+(writing.length?'<h4>Written-response self-check</h4>'+list(writing):'')+'<h3>Priority review</h3>'+(priority.length?list(priority):'<p>Use the second FRQ to apply these skills to a different visual.</p>')+'<p class="muted small">Correcting a retry keeps the original miss on your review list.</p><button class="primary" id="restart">Practice again</button><button id="extra">Optional second visual FRQ</button><p><a href="ap-human-geography-unit-3.html">Return to Unit 3 guide</a></p></div>';
document.getElementById('restart').addEventListener('click',()=>{i=0;mode='question';attempts={};frqReview=[];show()});
document.getElementById('extra').addEventListener('click',()=>{frqIndex=1;mode='frq';show();});
}
show();
})();
</script></body></html>
